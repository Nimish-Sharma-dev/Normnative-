# NORMATIVE // DEV 4 — docker-compose.yml
# Start everything with: docker-compose up --build
# All services start in the correct dependency order.

version: "3.9"

services:

  # ─────────────────────────────────────────────
  # Redis — shared message bus
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI backend (Dev 4 — this repo)
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./output:/app/output
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_HOST: 0.0.0.0
      API_PORT: 8000
      OUTPUT_DIR: /app/output/incidents
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────────
  # React frontend (Dev 4)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000

  # ─────────────────────────────────────────────
  # Log ingestor + simulator (Dev 1)
  # ─────────────────────────────────────────────
  ingestor:
    build:
      context: ./ingestor
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

  # ─────────────────────────────────────────────
  # ML models — LSTM + IForest + metrics (Dev 2)
  # ─────────────────────────────────────────────
  ml_models:
    build:
      context: ./ml_models
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./ml_models/models:/app/models

  # ─────────────────────────────────────────────
  # GNN + incident assembler (Dev 3)
  # ─────────────────────────────────────────────
  gnn:
    build:
      context: ./gnn
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      ml_models:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTPUT_DIR: /app/output/incidents
    volumes:
      - ./output:/app/output
      - ./gnn/models:/app/models

volumes:
  # Shared output volume so both api and gnn can read/write incidents
  output: {}
